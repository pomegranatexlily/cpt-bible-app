name: Install approved Covenant Bible icon and branding
on:
  push:
    branches: [main]
    paths: [.github/workflows/install-oustory-branding.yml]
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: install-oustory-branding
  cancel-in-progress: false
jobs:
  install:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install Pillow==11.3.0
      - name: Install approved icon, metadata, and menu without editing Scripture
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          from PIL import Image
          import base64, hashlib, io, re
          p = Path('index.html')
          text = p.read_text(encoding='utf-8')
          blob = p.read_bytes()
          actual = hashlib.sha1(b'blob ' + str(len(blob)).encode() + b'\0' + blob).hexdigest()
          if actual != 'ec507aff6db24a649408a8308b699d75b1d3f1ce':
              raise SystemExit('App changed since approval. No files modified; obtain a fresh review.')
          icon = Image.open(io.BytesIO(base64.b64decode(''))).convert('RGBA')
          assert icon.size == (256, 256)
          assert icon.getpixel((0, 0))[3] == 0
          Path('assets').mkdir(exist_ok=True)
          icon.save('assets/covenant-bible.png', optimize=True)
          for size in (180, 192):
              scaled = icon.resize((size, size), Image.Resampling.LANCZOS)
              dark = Image.new('RGBA', (size, size), (17, 17, 17, 255))
              dark.alpha_composite(scaled)
              dark.convert('RGB').save(f'assets/covenant-bible-{size}.png', optimize=True)
          Path('manifest.webmanifest').write_text('{\n  "name": "Oustory Bible App",\n  "short_name": "Bible",\n  "start_url": "./",\n  "scope": "./",\n  "display": "standalone",\n  "background_color": "#111111",\n  "theme_color": "#111111",\n  "icons": [\n    {\n      "src": "assets/covenant-bible-192.png",\n      "sizes": "192x192",\n      "type": "image/png",\n      "purpose": "any"\n    },\n    {\n      "src": "assets/covenant-bible.png",\n      "sizes": "256x256",\n      "type": "image/png",\n      "purpose": "any"\n    }\n  ]\n}', encoding='utf-8')
          Path('oustory-branding.css').write_text('.oustory-menu-heading{display:flex;align-items:center;justify-content:space-between;gap:16px;margin-bottom:20px}.oustory-menu-heading h2{margin:0;font-size:24px;line-height:1.2;font-weight:600;letter-spacing:-.04em}.oustory-menu-brand{display:flex;align-items:center;gap:16px;padding-bottom:23px;margin-bottom:8px;border-bottom:1px solid var(--line);min-width:0}.oustory-menu-brand img{width:76px;height:76px;object-fit:contain;flex:none;background:transparent}.oustory-menu-brand h3{margin:0 0 6px;font-size:25px;line-height:1.2;font-weight:500;letter-spacing:-.045em}.oustory-menu-brand p{margin:0;color:var(--muted);font-size:11px;line-height:1.6}.oustory-menu-row{display:block;width:100%;min-height:54px;padding:16px 0;border:0;border-bottom:1px solid var(--line);background:transparent;color:inherit;text-align:left;font:inherit;font-size:14px}.oustory-menu-row:hover{color:var(--muted)}.oustory-edition-icon{display:block;width:92px;height:92px;object-fit:contain;background:transparent;margin:6px 0 22px}#oustory-menu .icon-button{font-size:28px}#oustory-menu button:focus-visible{outline:2px solid var(--text);outline-offset:3px}\n', encoding='utf-8')
          Path('oustory-branding.js').write_text('(() => {\n  const settingsButton = document.querySelector(\'button[data-panel="settings-panel"]\');\n  if (!settingsButton || document.getElementById(\'oustory-menu\')) return;\n  const originalSettingsButton = settingsButton;\n  const opener = settingsButton.cloneNode(true);\n  opener.removeAttribute(\'data-panel\');\n  opener.setAttribute(\'aria-label\', \'Open Oustory menu\');\n  settingsButton.replaceWith(opener);\n  const menu = document.createElement(\'dialog\');\n  menu.id = \'oustory-menu\';\n  menu.setAttribute(\'aria-labelledby\', \'oustory-menu-title\');\n  const heading = document.createElement(\'div\');\n  heading.className = \'oustory-menu-heading\';\n  const title = document.createElement(\'h2\');\n  title.id = \'oustory-menu-title\';\n  title.textContent = \'Your Bible\';\n  const close = document.createElement(\'button\');\n  close.className = \'icon-button\';\n  close.textContent = \'×\';\n  close.setAttribute(\'aria-label\', \'Close menu\');\n  close.onclick = () => menu.close();\n  heading.append(title, close);\n  const brand = document.createElement(\'div\');\n  brand.className = \'oustory-menu-brand\';\n  const icon = document.createElement(\'img\');\n  icon.src = \'assets/covenant-bible.png\';\n  icon.alt = \'Covenant Bible\';\n  icon.width = 76;\n  icon.height = 76;\n  const identity = document.createElement(\'div\');\n  const name = document.createElement(\'h3\');\n  name.textContent = \'Oustory\';\n  const subtitle = document.createElement(\'p\');\n  subtitle.textContent = \'Covenant Bible · Our Story\';\n  identity.append(name, subtitle);\n  brand.append(icon, identity);\n  menu.append(heading, brand);\n  const actions = [\n    [\'Read the Bible\', () => { menu.close(); document.getElementById(\'reader\').focus(); }],\n    [\'Books & chapters\', () => document.querySelector(\'button[data-panel="books-panel"]\').click()],\n    [\'Search Scripture\', () => document.querySelector(\'button[data-panel="search-panel"]\').click()],\n    [\'Saved places\', () => document.querySelector(\'button[data-panel="saved-panel"]\').click()],\n    [\'Reading settings\', () => originalSettingsButton.click()],\n    [\'About this edition\', () => document.querySelector(\'button[data-panel="edition-panel"]\').click()]\n  ];\n  actions.forEach(([label, action]) => {\n    const button = document.createElement(\'button\');\n    button.className = \'oustory-menu-row\';\n    button.textContent = label;\n    button.onclick = () => { menu.close(); action(); };\n    menu.append(button);\n  });\n  document.body.append(menu);\n  opener.onclick = () => menu.showModal();\n  const edition = document.getElementById(\'edition-panel\');\n  if (edition) {\n    const editionIcon = icon.cloneNode(true);\n    editionIcon.className = \'oustory-edition-icon\';\n    edition.querySelector(\'.sheet-header\').after(editionIcon);\n  }\n})();\n', encoding='utf-8')
          text = re.sub(r'<title>.*?</title>', '<title>Oustory Bible App — CPT After Passover Edition</title>', text, count=1)
          head = '<link rel="icon" type="image/png" href="assets/covenant-bible-192.png"><link rel="apple-touch-icon" sizes="180x180" href="assets/covenant-bible-180.png"><meta name="apple-mobile-web-app-title" content="Bible"><link rel="manifest" href="manifest.webmanifest"><link rel="stylesheet" href="oustory-branding.css">'
          text = text.replace('</head>', head + '</head>', 1)
          text = text.replace('</body>', '<script src="oustory-branding.js"></script></body>', 1)
          p.write_text(text, encoding='utf-8')
          PY
      - name: Commit generated branding assets to main
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html manifest.webmanifest oustory-branding.css oustory-branding.js assets/covenant-bible.png assets/covenant-bible-180.png assets/covenant-bible-192.png
          if git diff --cached --quiet; then exit 0; fi
          git commit -m "Install approved no-white Covenant Bible icon and branded menu"
          git push origin HEAD:main
