name: Oustory Mobile UI Smoke
on:
  pull_request:
  push:
    branches: [main]
    paths:
      - 'index.html'
      - 'sw.js'
      - 'oustory-release4.js'
      - 'oustory-release4.css'
      - 'scripts/release4_ui.mjs'
      - 'oustory-reader.js'
      - 'oustory-search.js'
      - 'oustory-research.js'
      - 'oustory-research.css'
      - 'scripts/build_kjv_comparison.py'
      - 'scripts/test_release2.py'
      - 'scripts/test_published_research.py'
      - 'data/terminology-review.json'
      - 'data/witness-questions.json'
      - 'scripts/build_search_index.py'
      - 'oustory-features.js'
      - 'oustory-share-card.js'
      - 'oustory-share-card.css'
      - 'scripts/share_card_ui.mjs'
      - 'oustory-workbench.js'
      - 'oustory-workbench.css'
      - 'data/interlinear/manifest.json'
      - 'scripts/workbench_ui.mjs'
      - 'oustory-calendar.js'
      - 'calendar/published.json'
      - '.nojekyll'
      - 'scripts/test_published_calendar.py'
      - 'scripts/stage_calendar_feed.py'
      - 'scripts/calendar_fallback_ui.mjs'
      - 'oustory-calendar-study.js'
      - 'data/covenant-study.json'
      - 'scripts/test_release3.py'
      - 'oustory-calendar.css'
      - 'calendar/archive.json'
      - 'oustory-features.css'
      - 'oustory-branding.js'
      - 'assets/covenant-bible-gold-source.webp'
      - 'scripts/build_covenant_icons.py'
      - 'data/editorial-notes.json'
      - 'scripts/ui_smoke.mjs'
      - 'scripts/test_release1.py'
      - '.github/workflows/ui-smoke.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  mobile:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Generate current brand assets for UI test
        run: |
          python -m pip install Pillow==11.3.0
          python scripts/build_covenant_icons.py
      - name: Install headless Chromium
        run: |
          npm install --no-save playwright@1.56.1
          npx playwright install --with-deps chromium
      - name: Generate verified Scripture search index
        run: python3 scripts/build_search_index.py --output data/search-index.json
      - name: Generate historical English comparison source
        run: python3 scripts/build_kjv_comparison.py --out data/compare
      - name: Verify Release 2 indexes and alignment
        run: python3 scripts/test_release2.py
      - name: Verify generated static comparison and search inventories
        run: python3 scripts/test_published_research.py
      - name: Validate study mapping against actual Oustory verses
        run: python3 scripts/test_release3.py
      - name: Verify source-controlled calendar snapshot
        run: python3 scripts/test_published_calendar.py
      - name: Check Release 4 syntax
        run: |
          node --check sw.js
          node --check oustory-release4.js
          node --check oustory-share-card.js
          node --check scripts/share_card_ui.mjs
          node --check oustory-workbench.js
          node --check scripts/workbench_ui.mjs
          node --check oustory-calendar.js
          node --check scripts/calendar_fallback_ui.mjs
          node --check scripts/release4_ui.mjs
      - name: Run isolated local site
        run: python3 -m http.server 8765 --bind 127.0.0.1 > /tmp/oustory-site.log 2>&1 &
      - name: Check all mobile navigation and verse details
        run: node scripts/ui_smoke.mjs
      - name: Verify offline reading, saved-data backup and accessibility
        run: node scripts/release4_ui.mjs
      - name: Test live-feed outage and verified offline calendar fallback
        run: node scripts/calendar_fallback_ui.mjs
      - name: Verify client-side verse image sharing and save
        run: node scripts/share_card_ui.mjs
      - name: Verify phone-first Compare, Interlinear, Notes and backup
        run: node scripts/workbench_ui.mjs
      - name: Save mobile preview screenshots
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: oustory-mobile-screenshots
          path: out/ui-smoke/
          if-no-files-found: warn
          retention-days: 14
