name: Deploy Oustory Bible App
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: write
  pages: write
  id-token: write
concurrency:
  group: oustory-pages
  cancel-in-progress: true
jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Check out current app
        uses: actions/checkout@v4
        with:
          ref: main
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Prepare pinned Oustory poster icon assets
        run: |
          python -m pip install Pillow==11.3.0
          python scripts/build_covenant_icons.py
      - name: Verify complete 80-book reader data and JavaScript
        run: python3 scripts/check_content.py
      - name: Validate Release 4 JavaScript syntax
        run: |
          node --check sw.js
          node --check oustory-release4.js
          node --check oustory-calendar.js
          node --check oustory-share-card.js
          node --check oustory-workbench.js
          node --check scripts/workbench_ui.mjs
          node --check scripts/share_card_ui.mjs
          node --check scripts/release4_ui.mjs
      - name: Verify source-controlled calendar and offline static publication
        run: python3 scripts/test_published_calendar.py
      - name: Build and validate published historical witness and search data
        run: |
          python3 scripts/build_search_index.py --output data/search-index.json
          python3 scripts/build_kjv_comparison.py --out data/compare
          python3 scripts/test_release2.py
          python3 scripts/test_published_research.py
      - name: Commit generated publication assets for both GitHub Pages modes
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/search-index.json data/compare/
          if ! git diff --cached --quiet; then
            git commit -m "Publish source-pinned 1611 comparison and 80-book search index"
            git push origin HEAD:main
          fi
      - name: Configure Pages
        uses: actions/configure-pages@v5
        with:
          enablement: true
      - name: Stage public app files only
        shell: bash
        run: |
          mkdir -p _site
          cp .nojekyll _site/.nojekyll
          cp index.html manifest.webmanifest oustory-branding.css oustory-branding.js oustory-features.css oustory-features.js oustory-calendar.css oustory-calendar.js oustory-calendar-study.js oustory-audio.js oustory-search.js oustory-research.js oustory-research.css cpt-index.js oustory-reader.js oustory-release4.js oustory-release4.css oustory-share-card.js oustory-share-card.css oustory-workbench.js oustory-workbench.css sw.js _site/
          cp -R assets _site/assets
          cp -R data _site/data
          cp -R calendar _site/calendar
          test -f _site/data/genesis.json
          test -f _site/data/isaiah.json
          test -f _site/data/the-rest-of-esther.json
          test -f _site/data/2-maccabees.json
          test -f _site/data/revelation.json
          test -f _site/assets/oustory-poster-icon-180.png
          test -f _site/assets/oustory-poster-icon-192.png
          test -f _site/assets/oustory-poster-icon-512.png
          test -f _site/sw.js
          test -f _site/oustory-release4.js
          test -f _site/oustory-release4.css
          test -s _site/oustory-share-card.js
          test -s _site/oustory-share-card.css
          test -s _site/oustory-workbench.js
          test -s _site/oustory-workbench.css
          test -s _site/data/interlinear/manifest.json
          test -f _site/oustory-reader.js
          test -f _site/oustory-search.js
          test -f _site/oustory-research.js
          test -f _site/oustory-research.css
          test -f _site/data/terminology-review.json
          test -f _site/data/witness-questions.json
          test -f _site/oustory-audio.js
          test -f _site/oustory-features.js
          test -f _site/oustory-features.css
          test -f _site/oustory-calendar.js
          test -f _site/oustory-calendar-study.js
          test -f _site/data/covenant-study.json
          test -f _site/oustory-calendar.css
          test -s _site/data/search-index.json
          test -s _site/data/compare/manifest.json
          test -s _site/data/compare/psalms.json
          test -s _site/calendar/published.json
          test -f _site/calendar/archive.json
          test -f _site/data/editorial-notes.json
          test "$(find _site/data -maxdepth 1 -name '*.json' | wc -l)" -eq 86
      - name: Upload app
        uses: actions/upload-pages-artifact@v4
        with:
          path: _site
      - name: Publish app
        id: deployment
        uses: actions/deploy-pages@v4
      - name: Confirm hosted 1611 Psalms 2 and 80-book search files exist
        shell: bash
        run: |
          ROOT="https://pomegranatexlily.github.io/cpt-bible-app"
          for attempt in $(seq 1 12); do
            if curl --fail --silent --show-error --location --max-time 12 "$ROOT/data/compare/manifest.json" -o /tmp/live-compare-manifest.json && \
               curl --fail --silent --show-error --location --max-time 12 "$ROOT/data/compare/psalms.json" -o /tmp/live-compare-psalms.json && \
               curl --fail --silent --show-error --location --max-time 20 "$ROOT/data/search-index.json" -o /tmp/live-verse-search.json && \
               python3 -c 'import json; m=json.load(open("/tmp/live-compare-manifest.json")); p=json.load(open("/tmp/live-compare-psalms.json")); s=json.load(open("/tmp/live-verse-search.json")); assert m["version"]==1 and len(m["books"])==80; assert p["book_id"]=="psalms" and "2" in p["positions"] and p["positions"]["2"].get("1"); assert s["verse_count"]==36801 and len(s["book_ids"])==80'; then
              echo "PASS hosted Psalms 2 1611 comparison and complete search index"
              exit 0
            fi
            echo "Research publication not ready (attempt $attempt of 12)"
            sleep 5
          done
          echo "FAIL: published historical comparison or Scripture search missing"
          exit 1
      - name: Verify the actual public calendar endpoint responds with valid dates
        shell: bash
        run: |
          URL="https://pomegranatexlily.github.io/cpt-bible-app/calendar/published.json"
          for attempt in $(seq 1 12); do
            if curl --fail --silent --show-error --location --max-time 12 "$URL" -o /tmp/oustory-live-calendar.json && \
              python3 -c 'import json; d=json.load(open("/tmp/oustory-live-calendar.json")); assert d["schema_version"]==2; assert d["tracks"]["earlier"]["years"][0]["start_date"]=="2027-03-09"; assert d["tracks"]["later"]["years"][0]["start_date"]=="2027-04-07"'; then
              echo "PASS $URL serves valid Early and Late calendar JSON"
              exit 0
            fi
            echo "Calendar endpoint not ready (attempt $attempt of 12)"
            sleep 5
          done
          echo "FAIL: public Oustory calendar endpoint missing or invalid"
          exit 1
