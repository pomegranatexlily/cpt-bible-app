name: Deploy Oustory Bible App
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
  pages: write
  id-token: write
concurrency:
  group: oustory-pages
  cancel-in-progress: true
jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Check out current app
        uses: actions/checkout@v4
        with:
          ref: main
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Prepare pinned gold icon assets
        run: |
          python -m pip install Pillow==11.3.0
          python scripts/build_covenant_icons.py
      - name: Verify complete 80-book reader data and JavaScript
        run: python3 scripts/check_content.py
      - name: Validate Release 4 JavaScript syntax
        run: |
          node --check sw.js
          node --check oustory-release4.js
          node --check scripts/release4_ui.mjs
      - name: Configure Pages
        uses: actions/configure-pages@v5
        with:
          enablement: true
      - name: Stage public app files only
        shell: bash
        run: |
          mkdir -p _site
          cp index.html manifest.webmanifest oustory-branding.css oustory-branding.js oustory-features.css oustory-features.js oustory-calendar.css oustory-calendar.js oustory-calendar-study.js oustory-audio.js oustory-search.js oustory-research.js oustory-research.css cpt-index.js oustory-reader.js oustory-release4.js oustory-release4.css sw.js _site/
          cp -R assets _site/assets
          cp -R data _site/data
          cp -R calendar _site/calendar
          test -f _site/data/genesis.json
          test -f _site/data/isaiah.json
          test -f _site/data/the-rest-of-esther.json
          test -f _site/data/2-maccabees.json
          test -f _site/data/revelation.json
          test -f _site/assets/covenant-bible-gold-180.png
          test -f _site/assets/covenant-bible-gold-192.png
          test -f _site/assets/covenant-bible-gold-512.png
          test -f _site/sw.js
          test -f _site/oustory-release4.js
          test -f _site/oustory-release4.css
          test -f _site/oustory-reader.js
          test -f _site/oustory-search.js
          test -f _site/oustory-research.js
          test -f _site/oustory-research.css
          test -f _site/data/terminology-review.json
          test -f _site/data/witness-questions.json
          test -f _site/oustory-audio.js
          test -f _site/oustory-features.js
          test -f _site/oustory-features.css
          test -f _site/oustory-calendar.js
          test -f _site/oustory-calendar-study.js
          test -f _site/data/covenant-study.json
          test -f _site/oustory-calendar.css
          test -f _site/calendar/archive.json
          test -f _site/data/editorial-notes.json
          test "$(find _site/data -maxdepth 1 -name '*.json' | wc -l)" -eq 85
      - name: Generate version-matched full-text index
        run: |
          python3 scripts/build_search_index.py --output _site/data/search-index.json
          test -s _site/data/search-index.json
      - name: Generate pinned historical KJV comparison for all 80 titles
        run: |
          python3 scripts/build_kjv_comparison.py --out _site/data/compare
          test -s _site/data/compare/manifest.json
          test -f _site/data/compare/genesis.json
          test -f _site/data/compare/matthew.json
          test -f _site/data/compare/the-rest-of-esther.json
      - name: Upload app
        uses: actions/upload-pages-artifact@v4
        with:
          path: _site
      - name: Publish app
        id: deployment
        uses: actions/deploy-pages@v4
