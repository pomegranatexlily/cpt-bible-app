name: Build approved Covenant Bible gold icons
on:
  push:
    branches: [main]
    paths:
      - 'assets/covenant-bible-gold-source.webp'
      - 'scripts/build_covenant_icons.py'
      - '.github/workflows/build-covenant-icons.yml'
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: oustory-gold-icons
  cancel-in-progress: false
jobs:
  icons:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: true
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Render reproducible icon sizes
        run: |
          python -m pip install Pillow==11.3.0
          python scripts/build_covenant_icons.py
      - name: Validate 80-book source and new icon metadata
        run: python scripts/check_content.py
      - name: Commit updated app icons
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add assets/covenant-bible-gold-180.png assets/covenant-bible-gold-192.png assets/covenant-bible-gold-256.png assets/covenant-bible-gold-512.png
          if ! git diff --cached --quiet; then
            git commit -m 'assets: install approved gold Covenant Bible app icons'
            git push origin HEAD:main
          fi
