name: Inspect modern public-domain additional-books witness
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths: ['.github/workflows/probe-modern-witness.yml']
permissions: {contents: read}
jobs:
  inspect:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Inspect WEB Classic USFM structure
        run: |
          python - <<'PY'
          import urllib.request,zipfile,io
          u="https://ebible.org/Scriptures/eng-web_usfm.zip"
          d=urllib.request.urlopen(urllib.request.Request(u,headers={"User-Agent":"CPT-APE-translation-audit/1.0"}),timeout=90).read(20000000)
          print("DOWNLOADED",len(d),flush=True)
          z=zipfile.ZipFile(io.BytesIO(d))
          fs=z.namelist()
          print("FILES",len(fs),flush=True)
          for name in fs:
              if any(s in name.upper() for s in ['1ES','2ES','TOB','JDT','WIS','SIR','BAR','SUS','BEL','MAN','MA1','MA2','GES','ESG','AZA','EST']):
                  print("MATCH",name,flush=True)
          print("FIRST_FILES",fs[:30],flush=True)
          for name in fs:
              if name.lower().endswith(('.sfm','.usfm','.txt')) and any(s in name.upper() for s in ['1ES','TOB']):
                  print("SAMPLE_FILE",name,flush=True)
                  print(z.read(name).decode('utf8','replace')[:2400],flush=True)
                  break
          PY
